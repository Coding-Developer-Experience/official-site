<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Codex animated banner">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="45%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
      <animate attributeName="x1" values="0;1;0" dur="18s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0;1" dur="18s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="txtGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#F59E0B"/>
      <animate attributeName="x2" values="1;1.6;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animate attributeName="r" values="40%;60%;40%" dur="6s" repeatCount="indefinite"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- sky -->
  <rect width="1200" height="380" fill="url(#skyGrad)"/>

  <!-- sun glow -->
  <circle cx="980" cy="70" r="90" fill="url(#glow)" filter="url(#soft)">
    <animate attributeName="cy" values="70;90;70" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="980" cy="70" r="26" fill="#FDE68A"/>

  <!-- clouds drifting -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="-200,0;1320,0" dur="34s" repeatCount="indefinite"/>
    <ellipse cx="110" cy="300" rx="95" ry="34" fill="#ffffff" opacity="0.9"/>
    <ellipse cx="70" cy="285" rx="55" ry="26" fill="#ffffff" opacity="0.95"/>
    <ellipse cx="150" cy="288" rx="60" ry="27" fill="#ffffff" opacity="0.92"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="1390,0;-180,0" dur="26s" repeatCount="indefinite"/>
    <ellipse cx="200" cy="180" rx="80" ry="28" fill="#ffffff" opacity="0.8"/>
    <ellipse cx="165" cy="166" rx="48" ry="22" fill="#ffffff" opacity="0.85"/>
    <ellipse cx="235" cy="170" rx="52" ry="23" fill="#ffffff" opacity="0.82"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="900,0;-260,0" dur="40s" repeatCount="indefinite"/>
    <ellipse cx="520" cy="80" rx="70" ry="24" fill="#ffffff" opacity="0.75"/>
    <ellipse cx="485" cy="68" rx="44" ry="19" fill="#ffffff" opacity="0.8"/>
    <ellipse cx="555" cy="72" rx="46" ry="20" fill="#ffffff" opacity="0.78"/>
  </g>

  <!-- floating dots -->
  <circle cx="240" cy="110" r="7" fill="#60A5FA">
    <animate attributeName="cy" values="110;130;110" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="760" cy="120" r="9" fill="#FBBF24">
    <animate attributeName="cy" values="120;100;120" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1040" cy="150" r="6" fill="#34D399">
    <animate attributeName="cy" values="150;170;150" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- title -->
  <g>
    <text x="50%" y="200" text-anchor="middle" font-family="'SF Pro Display', 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="88" font-weight="800" letter-spacing="-2" fill="url(#txtGrad)">Codex.</text>
    <animate attributeName="opacity" values="0;1" dur="2s" fill="freeze" begin="0.4s"/>
    <animate attributeName="transform" type="translate" values="0,0;0,-8;0,0" dur="7s" repeatCount="indefinite"/>
  </g>

  <!-- tagline -->
  <text x="50%" y="258" text-anchor="middle" font-family="'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#334155">Build. Learn. Together.</text>

  <!-- pulse ring -->
  <circle cx="50%" cy="300" r="10" fill="none" stroke="#3B82F6" stroke-width="3">
    <animate attributeName="r" values="10;26;10" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0;0.9" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="50%" cy="300" r="5" fill="#2563EB"/>
</svg>